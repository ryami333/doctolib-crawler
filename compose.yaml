name: "doctolib-crawler"

services:
  valkey:
    volumes:
      - ./data/valkey:/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    image: valkey/valkey:9-alpine
    networks:
      - dc-internal
    healthcheck:
      test: ["CMD", "valkey-cli", "--raw", "incr", "ping"]
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: node ./lib/worker.ts
    env_file: .env
    environment:
      GMAIL_PASS_FILE: /run/secrets/GMAIL_PASS
    secrets:
      - GMAIL_PASS
    networks:
      - dc-internal
    depends_on:
      - valkey
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    command: yarn vite
    env_file: .env
    environment:
      AUTH_SECRET_FILE: /run/secrets/AUTH_SECRET
      OAUTH_CLIENT_SECRET_FILE: /run/secrets/OAUTH_CLIENT_SECRET
      VALKEY_HOST: valkey
    secrets:
      - AUTH_SECRET
      - OAUTH_CLIENT_SECRET
    networks:
      - dc-internal
    depends_on:
      - valkey
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
secrets:
  GMAIL_PASS:
    file: ./secrets/GMAIL_PASS
  AUTH_SECRET:
    file: ./secrets/AUTH_SECRET
  OAUTH_CLIENT_SECRET:
    file: ./secrets/OAUTH_CLIENT_SECRET
networks:
  dc-internal:
    driver: bridge
