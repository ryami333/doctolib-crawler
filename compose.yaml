services:
  valkey:
    volumes:
      - ./data/valkey:/data
    image: valkey/valkey:9-alpine
    networks:
      - dc-internal
    healthcheck:
      test: ["CMD", "valkey-cli", "--raw", "incr", "ping"]
  puppeteer:
    image: browserless/chrome:latest
    environment:
      TOKEN_FILE: /run/secrets/PUPPETEER_TOKEN
    secrets:
      - PUPPETEER_TOKEN
    networks:
      - dc-internal
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: node ./lib/worker.ts
    env_file: .env
    environment:
      GMAIL_PASS_FILE: /run/secrets/GMAIL_PASS
      PUPPETEER_HOST: puppeteer
      PUPPETEER_PORT: 3000
      PUPPETEER_TOKEN_FILE: /run/secrets/PUPPETEER_TOKEN
    secrets:
      - GMAIL_PASS
      - PUPPETEER_TOKEN
    networks:
      - dc-internal
    depends_on:
      - valkey
      - puppeteer
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    command: yarn next start
    env_file: .env
    environment:
      AUTH_SECRET_FILE: /run/secrets/AUTH_SECRET
      OAUTH_CLIENT_SECRET_FILE: /run/secrets/OAUTH_CLIENT_SECRET
    secrets:
      - AUTH_SECRET
      - OAUTH_CLIENT_SECRET
    networks:
      - dc-internal
    depends_on:
      - valkey
secrets:
  GMAIL_PASS:
    file: ./secrets/GMAIL_PASS
  PUPPETEER_TOKEN:
    file: ./secrets/PUPPETEER_TOKEN
  AUTH_SECRET:
    file: ./secrets/AUTH_SECRET
  OAUTH_CLIENT_SECRET:
    file: ./secrets/OAUTH_CLIENT_SECRET
networks:
  dc-internal:
    driver: bridge
